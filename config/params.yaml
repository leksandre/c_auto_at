los_guidance_node:
  ros__parameters:
    attack:
      max_approach_distance_m: 5.0  # 200.0
    gps:
      source: "uart"   # Меняйте на "uart", чтобы использовать внешний GPS
    uart_gps:
      enable: true       # Включить чтение внешнего GPS через UART
      port: "/dev/ttyS1" # Путь к вашему USB-UART адаптеру
      baudrate: 9600     # Стандартная скорость для большинства модулей (UBLOX и т.д.)
    logging:
      throttle_interval_ms: 136000
    takeoff:
      climb_rate_mps: -1.0  # 10 м/с
      target_altitude_m: 60.0 
      altitude_threshold_m: 1.5 
      min_altitude_already_flying_m: 2.0 
      min_cycles_for_already_flying: 120 
      skip: false                    # Пропуск взлёта
      visual_searching: true         # 🔍 Визуальный поиск после взлёта
      visual_search_timeout_s: 300   # ⏰ 5 минут ожидания
      timeout_s: 5 # 20 секунд для нормального взлёта
    sensor_sync:
      debug_log_interval: 165000  # Вывод на 1-м и каждый 500-й раз
    # === Tracker ===
    camera:
      # Камера
      fx: 410.0
      fy: 410.0
      cx: 640.0
      cy: 640.0
      vertical_fov_deg: 60.0
      
      # Установка камеры
      install:
        roll_deg: 0.0
        pitch_deg: 5.0
        yaw_deg: 0.0
      
      # Фильтрация ⬇️ УВЕЛИЧЕНО для тяжёлого дрона
      pixel_smooth_alpha: 0.5      # ↑ Было 0.3 (↑67%)
      los_smooth_alpha: 0.2        # ↑ Было 0.1 (↑100%)
      min_confidence: 0.6          # ↑ Было 0.5 (строже)
    
    # === Kalman Filter LOS ===
    kalman:
      los_process_noise_Q: 0.016   # ↑ Было 0.01 (×1.6)
      los_measurement_noise_R: 0.16 # ↑ Было 0.1 (×1.6)
      use_gyro_compensation: true  # ✅ ВКЛЮЧИТЬ для тяжёлого
      enable_adaptive_noise: true  # ✅ ВКЛЮЧИТЬ
      adaptive_min_scale: 0.5
      adaptive_max_scale: 15.0
      innovation_gate_sigma: 3.0   # 🆕 Отсечение выбросов
    
    # === Наведение (Guidance) ===
    guidance:
      pn_gain_N: 2.4               # ↓ Было 3.0 (×0.79)
      max_tilt_deg: 35.0           # ↓ Было 45.0 (безопаснее)
      min_tilt_deg: 8.0            # ↑ Было 5.0
      enable_PI_control: true      # ✅ ВКЛЮЧИТЬ для тяжёлого
      enable_acceleration_parallel: false
      top_attack_mode: false
      
      # 🆕 Компенсация ЦТ (если сместился)
      cg_trim_pitch_deg: 2.5       # Настроить экспериментально
      cg_pitch_offset_deg: 2.0
      enable_cg_compensation: true
    
    # === Скорость (Vc estimation) ===
    velocity:
      min_vc_mps: 1.2              # ↑ Было 1.0 (тяжелее разгон)
      max_vc_mps: 12.5             # ↓ Было 20.0 (×0.62)
      vc_alpha_smooth: 0.16        # ↑ Было 0.1 (×1.6)
      
      # 🆕 Масштабирование для тяжёлого
      vc_pitch_scale: 0.62         # = accel_scale
      vc_acc_scale: 0.62
    
    # === PI контроллер LOS ===
    los_pi:
      y:
        kp: 2.4                    # ↓ Было 3.0 (×0.79)
        ki: 0.008                  # ↓ Было 0.01 (×0.79)
        ff_enable: true
        ff_gain: 5.5               # ↓ Было 7.0 (×0.79)
        ff_limit: 2.4              # ↓ Было 3.0 (×0.79)
        err_ff_limit: 0.15
        int_limit: 2.4             # ↓ Было 3.0 (×0.79)
      z:
        kp: 2.4                    # ↓ Было 3.0 (×0.79)
        ki: 0.008                  # ↓ Было 0.01 (×0.79)
        ff_enable: true
        ff_gain: 5.5               # ↓ Было 7.0 (×0.79)
        ff_limit: 2.4              # ↓ Было 3.0 (×0.79)
        err_ff_limit: 0.15
        int_limit: 4.0             # ↓ Было 5.0 (×0.79)
    
    # === Intercept алгоритм ===
    intercept:
      kp: 2.4                      # ↓ Было 3.0 (×0.79)
      ki: 0.008                    # ↓ Было 0.01 (×0.79)
      kd: 0.008                    # ↓ Было 0.01 (×0.79)
      int_limit: 0.8               # ↓ Было 1.0 (×0.79)
      z_kp: 4.0                    # ↓ Было 5.0 (×0.79)
      acc_alpha: 0.16              # ↑ Было 0.1 (×1.6)
    
    # === Ограничения ускорений ===
    acceleration:
      max_lateral_mps2: 1.86       # ↓ Было 3.0 (×0.62)
      max_vertical_up_mps2: -3.1   # ↓ Было -5.0 (×0.62)
      max_vertical_down_mps2: 3.1  # ↓ Было 5.0 (×0.62)
      max_horizontal_mps2: 7.44    # ↓ Было 12.0 (×0.62)
      ax_rate_limit_mps3: 0.62     # ↓ Было 1.0 (×0.62)
      apn_alpha: 0.16              # ↑ Было 0.1 (×1.6)
      
      parallel:
        enable: false
        gain: 0.062                # ↓ Было 0.1 (×0.62)
        alpha: 0.16                # ↑ Было 0.1 (×1.6)
        max_mps2: 1.24             # ↓ Было 2.0 (×0.62)
    
    # === ADRC ===
    adrc:
      td_r: 800.0                  # ↓ Было 1000.0 (плавнее)
      td_h: 0.016                  # ↑ Было 0.01 (медленнее)
      td_n: 2
    
    # === Синхронизация ===
    sync:
      buffer_size: 160             # ↑ Было 100 (×1.6)
      retention_us: 320000         # ↑ Было 200000 (×1.6)
      debug: true
    
    # === Таймеры ===
    timer:
      update_ms: 25                # ↑ Было 20 (тяжёлый медленнее)

    commander:
      enable: true
      port: 11472
      targets: [ "192.168.14.169", "192.168.14.175", "192.168.14.179"] # если лист пустой... какая логика?
      target_port: 11472  # Порт, на котором цели слушают запросы SHOWGPS //11471 было
    
    # === Параметры ручного управления (добавлено) ===
    manual_control:
      update_rate_hz: 20          # Частота приёма команд
      deadzone: 0.05              # Мёртвая зона джойстика
      smoothing_alpha_base: 0.1   # Базовое сглаживание
      smoothing_alpha_max: 0.3    # Макс. сглаживание при больших отклонениях
      max_rate_per_sec: 2.0       # Макс. скорость изменения команд
      max_accel_mps2: 1.0        # Макс. ускорение (из guidance), уменьшено для неопытных
      max_yaw_rate_dps: 30.0      # Макс. скорость вращения (град/с), уменьшено для неопытных
      max_vert_speed_mps: 1.0     # Макс. вертикальная скорость, уменьшено для неопытных
            
      # === Мёртвые зоны (Deadzones) ===
      # Если стик находится в этом диапазоне вокруг центра, сигнал считается нулевым.
      # Защищает от дрейфа из-за дребезга джойстика или вибраций.
      roll_deadzone: 0.05              # ±0.05 по крену (диапазон ввода: -1.0 ... 1.0)
      pitch_deadzone: 0.05             # ±0.05 по тангажу
      yaw_deadzone: 0.05               # ±0.05 по рысканью
      throttle_deadzone: 0.05          # ±0.05 вокруг центра газа (центр = 0.5)

      # === Ограничение скорости изменения (Slew Rate Limiting) ===
      # Максимально допустимое изменение отфильтрованного сигнала за 1 секунду.
      # Делает управление "вязким", предотвращает резкие рывки дрона.
      max_roll_slew_rate: 2.0          # ед./с (полный ход от -1 до 1 за 1 сек = 2.0)
      max_pitch_slew_rate: 2.0
      max_yaw_slew_rate: 2.0
      max_throttle_slew_rate: 2.0

      # === Параметры фильтра низких частот (LPF / Exponential Smoothing) ===
      filter_time_constant: 0.3        # Постоянная времени фильтра (сек). 
                                      # 0 = без фильтра, 0.1 = среднее сглаживание, >0.5 = очень плавное/медленное.
      ship_mode_response_factor: 0.5   # Множитель плавности ("режим корабля"). 
                                      # Формула: tau = filter_time_constant / factor.
                                      # < 1.0 → замедляет реакцию (тяжёлый дрон/корабль)
                                      # > 1.0 → ускоряет отклик (спортивный режим)
                                      # 1.0 → нейтральное значение

      # === Аварийная защита газа (Throttle Safety Lockout) ===
      spike_filter_time_window: 0.5    # Окно наблюдения за газом (секунды). 
                                      # Система анализирует историю газа только за этот промежуток.
      enable_emergency_lockout: true   # Глобальный выключатель аварийной блокировки. 
                                      # Если false → все проверки газа пропускаются.
      throttle_spikes_threshold: 0.9   # Порог блокировки "перегазовки". 
                                      # Если газ резко превысит 90% в окне наблюдения → команда игнорируется.
      throttle_cutoff_threshold: 0.1   # Порог блокировки "сброса газа". 
                                      # Если газ резко упадёт ниже 10% → команда игнорируется. 
                                      # Защищает от случайного отключения моторов в полёте.

      # === Разрешение специальных команд ===
      allow_vision_attack: true        # Разрешить переход в режим VISUAL_ATTACK по TCP-команде.
      allow_autoland: true             # Разрешить запуск режима AUTO_LAND по TCP-команде.